version: '3.8'

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    restart: unless-stopped
    ports:
      - "3500:3500"
    env_file:
      - .env
    depends_on:
      - mongodb
      - redis
    networks:
      - bytemail-network
    volumes:
      - uploads:/app/uploads
      - logs:/app/logs

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/log/nginx:/var/log/nginx
    depends_on:
      - server
    networks:
      - bytemail-network

  mongodb:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: bytemail
      MONGO_INITDB_ROOT_PASSWORD: ByteMail@2026
      MONGO_INITDB_DATABASE: bytemail
    volumes:
      - mongodb-data:/data/db
    networks:
      - bytemail-network
    ports:
      - "27017:27017"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ByteMailRedis@2026
    volumes:
      - redis-data:/data
    networks:
      - bytemail-network
    ports:
      - "6379:6379"

volumes:
  mongodb-data:
  redis-data:
  uploads:
  logs:

networks:
  bytemail-network:
    driver: bridge
