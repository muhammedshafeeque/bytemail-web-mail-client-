<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ByteMail - Offline</title>
  <style>
    body {
      margin: 0;
      font-family: 'Inter', system-ui, sans-serif;
      background: #f9fafb;
      color: #111827;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 1rem;
    }
    .icon { font-size: 3rem; margin-bottom: 1rem; }
    h1 { font-size: 1.5rem; font-weight: 700; margin: 0 0 0.5rem; }
    p { color: #6b7280; font-size: 0.875rem; margin: 0 0 1.5rem; }
    a {
      display: inline-block;
      background: #4f46e5;
      color: white;
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 600;
      padding: 0.625rem 1.25rem;
      border-radius: 0.75rem;
    }
  </style>
</head>
<body>
  <div>
    <div class="icon">📭</div>
    <h1>You're offline</h1>
    <p>ByteMail needs an internet connection to load.<br>Your cached emails are still available.</p>
    <a href="/">Try again</a>
  </div>
</body>
</html>
